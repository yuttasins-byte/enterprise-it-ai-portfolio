<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise IT and AI Ecosystem</title>
  <desc id="desc">Architecture diagram connecting identity, internal web services, observability, SharePoint, notifications, structured data, MCP, RAG, and AI. Solid lines are implemented or proven; dashed lines are in progress or planned.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1565c0"/>
      <stop offset="1" stop-color="#00a6a6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020b14" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#63d7ff"/>
    </marker>
    <marker id="arrowFuture" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ffca63"/>
    </marker>
    <style>
      .title { font: 700 42px 'Segoe UI', Arial, sans-serif; fill: #f7fbff; }
      .subtitle { font: 400 20px 'Segoe UI', Arial, sans-serif; fill: #bdd5e6; }
      .lane { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #78a8c5; letter-spacing: 2px; }
      .box-title { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #f7fbff; }
      .box-sub { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #c9dcea; }
      .small { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #bdd5e6; }
      .badge { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #071525; letter-spacing: .6px; }
      .node { fill: #132f49; stroke: #39789f; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .node-ai { fill: url(#hero); stroke: #70ecdc; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .node-data { fill: #243658; stroke: #7e8eff; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .node-ops { fill: #173d44; stroke: #3fc7aa; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .solid { fill: none; stroke: #63d7ff; stroke-width: 3; marker-end: url(#arrow); }
      .future { fill: none; stroke: #ffca63; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrowFuture); }
      .divider { stroke: #31506a; stroke-width: 1; stroke-dasharray: 3 8; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="url(#bg)"/>
  <circle cx="1450" cy="80" r="260" fill="#0c6680" opacity=".12"/>
  <circle cx="120" cy="980" r="300" fill="#5668d8" opacity=".08"/>

  <text x="80" y="72" class="title">Enterprise IT &amp; AI Ecosystem</text>
  <text x="80" y="108" class="subtitle">From secure access and internal services to observable operations and grounded AI</text>

  <line x1="80" y1="164" x2="1520" y2="164" class="divider"/>
  <text x="80" y="151" class="lane">ACCESS &amp; TRUST</text>
  <line x1="80" y1="362" x2="1520" y2="362" class="divider"/>
  <text x="80" y="349" class="lane">APPLICATION &amp; INTEGRATION</text>
  <line x1="80" y1="625" x2="1520" y2="625" class="divider"/>
  <text x="80" y="612" class="lane">ENTERPRISE DATA, OPERATIONS &amp; KNOWLEDGE</text>

  <!-- access -->
  <rect x="95" y="205" width="280" height="100" class="node"/>
  <text x="235" y="246" text-anchor="middle" class="box-title">Enterprise Users</text>
  <text x="235" y="276" text-anchor="middle" class="box-sub">Employees • IT • Management</text>

  <rect x="525" y="195" width="360" height="120" class="node-ai"/>
  <text x="705" y="239" text-anchor="middle" class="box-title">Identity Gateway</text>
  <text x="705" y="270" text-anchor="middle" class="box-sub">OIDC • OAuth 2.0 • PKCE • RBAC</text>
  <rect x="740" y="285" width="124" height="22" rx="11" fill="#8ff3d4"/>
  <text x="802" y="301" text-anchor="middle" class="badge">IMPLEMENTED</text>

  <path d="M375 255 H515" class="solid"/>

  <!-- application layer -->
  <rect x="95" y="415" width="350" height="145" class="node-ai"/>
  <text x="270" y="458" text-anchor="middle" class="box-title">Internal Web Services</text>
  <text x="270" y="488" text-anchor="middle" class="box-sub">Workflows • APIs • Service Portal</text>
  <text x="270" y="517" text-anchor="middle" class="box-sub">3D Map / Digital Twin • Chatbot</text>
  <rect x="300" y="530" width="124" height="22" rx="11" fill="#8ff3d4"/>
  <text x="362" y="546" text-anchor="middle" class="badge">IMPLEMENTED</text>

  <rect x="535" y="415" width="340" height="145" class="node-data"/>
  <text x="705" y="458" text-anchor="middle" class="box-title">MCP Data Platform</text>
  <text x="705" y="488" text-anchor="middle" class="box-sub">Governed structured-data access</text>
  <text x="705" y="517" text-anchor="middle" class="box-sub">Login integration proven</text>
  <rect x="730" y="530" width="124" height="22" rx="11" fill="#8ff3d4"/>
  <text x="792" y="546" text-anchor="middle" class="badge">INTEGRATED</text>

  <rect x="965" y="415" width="350" height="145" class="node-ai"/>
  <text x="1140" y="458" text-anchor="middle" class="box-title">LLM / AI Assistant</text>
  <text x="1140" y="488" text-anchor="middle" class="box-sub">Conversation • Domain Routing</text>
  <text x="1140" y="517" text-anchor="middle" class="box-sub">Grounded responses</text>
  <rect x="1170" y="530" width="124" height="22" rx="11" fill="#8ff3d4"/>
  <text x="1232" y="546" text-anchor="middle" class="badge">IMPLEMENTED</text>

  <rect x="1360" y="415" width="165" height="145" class="node"/>
  <text x="1442" y="452" text-anchor="middle" class="box-title">Notification</text>
  <text x="1442" y="478" text-anchor="middle" class="box-title">Gateway</text>
  <text x="1442" y="509" text-anchor="middle" class="box-sub">Graph • Email</text>
  <text x="1442" y="535" text-anchor="middle" class="box-sub">Audit trail</text>

  <path d="M705 315 V380 H270 V405" class="solid"/>
  <path d="M705 315 V405" class="solid"/>
  <path d="M705 315 V380 H1140 V405" class="solid"/>
  <path d="M445 475 H525" class="solid"/>
  <path d="M445 505 C650 600 800 600 955 505" class="solid"/>
  <path d="M445 535 C700 650 1120 650 1350 535" class="solid"/>

  <!-- data / operations -->
  <rect x="80" y="690" width="250" height="125" class="node-ops"/>
  <text x="205" y="733" text-anchor="middle" class="box-title">Zabbix</text>
  <text x="205" y="763" text-anchor="middle" class="box-sub">Infrastructure telemetry</text>
  <text x="205" y="790" text-anchor="middle" class="box-sub">3D Map / Digital Twin</text>

  <rect x="365" y="690" width="250" height="125" class="node-ops"/>
  <text x="490" y="733" text-anchor="middle" class="box-title">Grafana</text>
  <text x="490" y="763" text-anchor="middle" class="box-sub">Operational analytics</text>
  <text x="490" y="790" text-anchor="middle" class="box-sub">Embedded dashboards</text>

  <rect x="650" y="690" width="250" height="125" class="node"/>
  <text x="775" y="733" text-anchor="middle" class="box-title">SharePoint Gateway</text>
  <text x="775" y="763" text-anchor="middle" class="box-sub">Controlled file upload</text>
  <text x="775" y="790" text-anchor="middle" class="box-sub">Document services</text>

  <rect x="935" y="690" width="250" height="125" class="node-data"/>
  <text x="1060" y="733" text-anchor="middle" class="box-title">Structured Data</text>
  <text x="1060" y="763" text-anchor="middle" class="box-sub">Internal APIs</text>
  <text x="1060" y="790" text-anchor="middle" class="box-sub">Authoritative systems</text>

  <rect x="1220" y="690" width="250" height="125" class="node-data"/>
  <text x="1345" y="733" text-anchor="middle" class="box-title">RAG Knowledge</text>
  <text x="1345" y="763" text-anchor="middle" class="box-sub">Approved content</text>
  <text x="1345" y="790" text-anchor="middle" class="box-sub">Unstructured knowledge</text>

  <path d="M205 680 V600 H230 V570" class="solid"/>
  <path d="M490 680 V600 H300 V570" class="solid"/>
  <path d="M775 680 V600 H370 V570" class="solid"/>
  <path d="M1060 680 V600 H705 V570" class="solid"/>
  <path d="M1345 680 V600 H1140 V570" class="solid"/>
  <path d="M1185 752 H1210" class="solid"/>
  <path d="M875 470 H955" class="future"/>

  <!-- legend / value -->
  <rect x="80" y="870" width="1440" height="120" rx="18" fill="#0b2034" stroke="#31506a"/>
  <text x="112" y="908" class="lane">RELATIONSHIP STATUS</text>
  <line x1="112" y1="943" x2="205" y2="943" class="solid"/>
  <text x="225" y="949" class="small">Implemented / integrated and supported by current portfolio context</text>
  <line x1="805" y1="943" x2="898" y2="943" class="future"/>
  <text x="918" y="949" class="small">In progress / next integration: MCP Data Platform → LLM</text>
  <text x="1515" y="1018" text-anchor="end" class="small">Sanitized portfolio view — no production endpoints, credentials, or confidential data</text>
</svg>
